[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chainguard"
version = "0.1.0"
description = "Fuse several SBOM generators and vulnerability scanners into one enforcing CI/CD security gate"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "ChainGuard contributors" }]
keywords = ["sbom", "supply-chain-security", "vulnerability-scanning", "devsecops", "ci-cd", "cyclonedx", "spdx"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Build Tools",
]
dependencies = ["packageurl-python>=0.15", "packaging>=23", "pyyaml>=6"]

[project.urls]
Homepage = "https://github.com/sreekarsarma55/_ChainGuard_"
Issues = "https://github.com/sreekarsarma55/_ChainGuard_/issues"

[project.optional-dependencies]
dev = ["ruff==0.17.0", "pytest>=8"]

[project.scripts]
chainguard = "chainguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chainguard = ["toolchain.env", "priority.yaml", "policy.yaml"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
